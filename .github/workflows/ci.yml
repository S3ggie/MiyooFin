name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host build, tests, and boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libsdl2-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev libjson-c-dev clang-format-18 python3 xvfb
          clang-format-18 --version

      - name: First-party C/C++ formatting
        # Keep CI on the documented clang-format 18 toolchain.
        run: CLANG_FORMAT=clang-format-18 make format-check

      - name: Build host application
        run: make -j2

      - name: Tests and refactor boundary checks
        # tools/refactor-check.sh runs `make test` and `git diff --check` and
        # enforces the module boundaries and test-only source registration.
        # xvfb provides a display for the SDL-backed host tests on the runner.
        run: xvfb-run -a sh tools/refactor-check.sh

  ui-script:
    # Headless scripted-input UI harness (docs/ui-script-harness.md):
    # drives the host build with a scripted key timeline via an LD_PRELOAD
    # shim against a loopback stub Jellyfin server. Needs no Miyoo, no
    # GHCR image, and no network beyond loopback.
    name: Scripted UI flows (stub server, no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libsdl2-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev libjson-c-dev python3 xvfb

      - name: Scripted UI flows
        # Sequential on purpose: flows share the /tmp screenshot flag file.
        run: xvfb-run -a make ui-script-test

      - name: Print failed scripted-flow diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          found=0
          for scenario in smoke series login-400; do
            dir="output/ui-script/$scenario"
            if [[ ! -d "$dir" ]]; then
              continue
            fi
            found=1
            echo "::group::ui-script/$scenario/result.txt"
            if [[ -f "$dir/result.txt" ]]; then
              cat "$dir/result.txt"
            else
              echo "(missing $dir/result.txt)"
            fi
            echo "::endgroup::"
            for log in app.log stub.log ui-stall.log; do
              path="$dir/$log"
              echo "::group::ui-script/$scenario/$log (last 200 lines)"
              if [[ -f "$path" ]]; then
                tail -n 200 -- "$path"
              else
                echo "(missing $path)"
              fi
              echo "::endgroup::"
            done
          done
          if [[ "$found" -eq 0 ]]; then
            echo "ui-script: no scenario diagnostics were produced"
          fi

      - name: Upload ui-script failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-script-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ui-script/**
          if-no-files-found: warn

  sanitizers:
    # Runs the host test suite under AddressSanitizer + UndefinedBehaviorSanitizer
    # to catch memory errors, UB, and leaks in first-party code. A ThreadSanitizer
    # job is intentionally out of scope (the codebase uses SDL threads in ways
    # TSan would flag noisily and it needs a separate instrumented build).
    name: Host tests under ASan+UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libsdl2-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev libjson-c-dev python3 xvfb

      - name: Tests under ASan+UBSan
        # xvfb provides a display for the SDL-backed host tests on the runner.
        run: xvfb-run -a make test-sanitize -j2

  arm-verify:
    # Real ARM cross-build verification using the prebuilt toolchain image.
    #
    # WHY THIS WORKS WITHOUT THE DEVICE BLOBS: the six device-imported
    # libraries in vendor/miyoo/lib (libEGL, libGLESv2, libmi_*) are only
    # needed to *build the Miyoo-patched SDL2* inside the Docker image (see
    # Dockerfile.onionos). That SDL2 is already built and baked into the
    # published miyoofin-toolchain image, so building MiyooFin itself needs
    # no blobs: our binary's NEEDED list contains no libmi_*/libEGL entries
    # (the device supplies libmi_* at runtime), and a build with an empty
    # /opt/miyoo/lib is byte-identical to one with the blobs present.
    # We therefore deliberately avoid `make onionos` / `make package` here:
    # those targets depend on `check-miyoo-libs` and would fail in CI where
    # the blobs cannot exist.
    name: ARM cross build + verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PERF_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull private toolchain image
        run: |
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/miyoofin-toolchain:latest"
          if ! docker pull "$IMAGE"; then
            echo "::error::Could not pull $IMAGE."
            echo "The private toolchain image has not been published yet, or this repository has no access to it."
            echo "Publish it once from a machine that has built the image with:"
            echo "  sh tools/push-toolchain-image.sh"
            echo "See docs/toolchain.md (CI toolchain image) for details."
            exit 1
          fi
          # make verify-arm and the cross build below expect this local tag.
          docker tag "$IMAGE" miyoofin-toolchain:latest

      - name: Cross-build ARM binaries
        # Same invocation as the Makefile's `onionos` target, minus the
        # blob preconditions (check-miyoo-libs) that CI cannot satisfy.
        # `mkdir -p` is normally done by the `onionos` target itself.
        run: |
          mkdir -p output/build-arm
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/build miyoofin-toolchain \
            make -f Makefile.cross PERF_TELEMETRY="$PERF_TELEMETRY" RELEASE=1 all bridge reporter

      - name: Verify ARM binaries
        run: make verify-arm
